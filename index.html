*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08060e;--bg2:#0e0a18;--card:#120c1f;--border:#241a3a;--purple:#a855f7;--purple2:#7c3aed;--gold:#ffd700;--gold2:#e6b800;--txt:#f0eaff;--mut:#9d92b8}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(124,58,237,.14),transparent),radial-gradient(900px 500px at -10% 30%,rgba(255,215,0,.05),transparent),var(--bg);color:var(--txt);overflow-x:hidden;min-height:100vh}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
#topbar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,7,18,.82);backdrop-filter:blur(14px);display:flex;align-items:center;padding:0 20px;z-index:100;border-bottom:1px solid var(--border)}
#topbar .logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
#topbar .logo img{width:30px;height:30px;border-radius:8px;object-fit:cover;box-shadow:0 0 12px rgba(168,85,247,.4)}
#topbar .logo span{font-weight:800;font-size:17px;letter-spacing:.5px;background:linear-gradient(90deg,#fff 30%,#c79bff 60%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#topbar .spacer{flex:1}
#sidebar{position:fixed;top:60px;left:0;bottom:0;width:76px;background:rgba(10,7,18,.6);backdrop-filter:blur(10px);overflow-y:auto;z-index:99;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px solid var(--border)}
#sidebar .s-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0;width:calc(100% - 12px);border-radius:12px;cursor:pointer;color:var(--mut);font-size:10px;font-weight:600;transition:all .22s;border:none;background:none;font-family:inherit}
#sidebar .s-item:hover{background:rgba(168,85,247,.12);color:#fff;transform:translateY(-1px)}
#sidebar .s-item.active{color:var(--gold);background:linear-gradient(180deg,rgba(168,85,247,.18),rgba(168,85,247,.06));box-shadow:inset 0 0 0 1px rgba(168,85,247,.35)}
#sidebar .s-item svg{width:22px;height:22px;display:block}
.main-content{margin-left:76px;margin-top:60px;padding:28px;min-height:calc(100vh - 60px);animation:fadeIn .4s ease}
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.yt-vid{cursor:pointer;transition:all .2s;border-radius:12px;overflow:hidden}
.yt-vid:hover{background:#1a1a1a}
.yt-vid .thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.yt-vid .thumb img{width:100%;height:100%;object-fit:cover}
.yt-vid .info{padding:8px 4px;display:flex;gap:10px}
.yt-vid .info .text{flex:1;min-width:0}
.yt-vid .info .title{font-size:14px;font-weight:500;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.yt-vid .info .meta{font-size:12px;color:#aaa;margin-top:4px}
#player-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column}
#player-overlay.show{display:flex}
#player-overlay .close-btn{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:#1a1a1a;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#player-overlay .close-btn:hover{background:#333}
#player-wrap{width:90%;max-width:960px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#player-wrap iframe{width:100%;height:100%;border:none}
#player-overlay .yt-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:10px 24px;background:#ff0000;color:#fff;border:none;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;font-family:inherit}
#player-overlay .yt-btn:hover{background:#cc0000}
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(120deg,rgba(124,58,237,.22),rgba(255,215,0,.06) 60%,transparent),var(--card);padding:34px 30px;margin-bottom:26px;animation:slideUp .5s ease}
.hero h1{font-size:28px;font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,#fff,#c79bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--mut);font-size:14px;max-width:560px;line-height:1.6;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;padding:11px 24px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .25s ease;letter-spacing:.3px;text-decoration:none;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(168,85,247,.45)}
.btn-outline{background:transparent;border:1px solid var(--border);color:#cbc0e6}
.btn-outline:hover{background:rgba(168,85,247,.1);border-color:var(--purple);color:#fff;box-shadow:none}
.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{background:#120c1f;border:1px solid var(--border);color:var(--mut);padding:8px 22px;font-size:13px;font-weight:600;cursor:pointer;border-radius:20px;transition:all .2s;box-shadow:none;font-family:inherit}
.tabs button.active{color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2));border-color:transparent}
.tabs button:hover{color:#fff;transform:none}
.shorts-shelf{display:flex;gap:12px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:thin}
.shorts-shelf::-webkit-scrollbar{height:4px}
.shorts-shelf::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.shorts-shelf .short-card{flex:0 0 180px;cursor:pointer;transition:all .2s;border-radius:10px;overflow:hidden}
.shorts-shelf .short-card:hover{transform:translateY(-4px)}
.shorts-shelf .short-card .thumb{width:100%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#222}
.shorts-shelf .short-card .thumb img{width:100%;height:100%;object-fit:cover}
.shorts-shelf .short-card .info{padding:8px 4px}
.shorts-shelf .short-card .info .title{font-size:13px;font-weight:500;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.shorts-shelf .short-card .info .meta{font-size:11px;color:#aaa;margin-top:2px}
.section-title{font-size:16px;font-weight:600;color:#fff;margin:20px 0 12px 0}
.skel{background:linear-gradient(90deg,#160f28 25%,#1f1636 50%,#160f28 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear;border-radius:12px}
#topbar input{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;width:100%;height:36px;outline:none}
#topbar input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
a{color:#c79bff;text-decoration:none;transition:color .2s}
a:hover{color:var(--gold)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#3a2a5e;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--purple)}
@media(max-width:768px){#sidebar{width:56px}#sidebar .s-item{padding:8px 0;font-size:8px}#sidebar .s-item svg{width:18px;height:18px}.main-content{margin-left:56px;padding:12px}.yt-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
@media(max-width:480px){
  #sidebar{top:auto;bottom:0;left:0;right:0;width:100%;height:52px;flex-direction:row;padding:0;border-top:1px solid #241a3a;border-right:none;overflow-x:hidden;justify-content:space-around}

  #sidebar .s-item svg{width:16px;height:16px}
  .main-content{margin-left:0;margin-bottom:52px;padding:8px}
  #topbar{height:48px}
  #topbar .logo span{display:none}
  .main-content{margin-top:48px}
  #player-overlay .close-btn{top:8px;left:8px;width:32px;height:32px;font-size:16px}
  #player-wrap{width:100%;border-radius:0}
}
  </style>

    function openPlayer(videoId) {
      var overlay = document.getElementById('player-overlay');
      var wrap = document.getElementById('player-wrap');
      var ytBtn = document.getElementById('watch-on-yt');
      var yt = 'https://www.youtube.com/watch?v=' + videoId;
      wrap.innerHTML = '<iframe src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
      ytBtn.href = yt;
      overlay.classList.add('show');
    }
    function closePlayer() {
      document.getElementById('player-overlay').classList.remove('show');
      document.getElementById('player-wrap').innerHTML = '';
    }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePlayer(); });

    function renderGrid(list) {
      var g = document.getElementById('video-grid');
      if (!list || !list.length) {
        g.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">No videos</div>';
        return;
      }
      g.innerHTML = '';
      list.forEach(function(v) {
        var d = document.createElement('div');
        d.className = 'yt-vid';
        d.innerHTML = '<div class="thumb"><img src="' + v.thumb + '" alt="" loading="lazy"></div><div class="info"><div class="text"><div class="title">' + v.title + '</div><div class="meta">' + (v.views||'') + (v.views&&v.ago?' \u00b7 ':'') + (v.ago||'') + '</div></div></div>';
        d.addEventListener('click', function(){ openPlayer(v.id); });
        g.appendChild(d);
      });
    }

    function renderShorts(list) {
      var shelf = document.getElementById('shorts-shelf');
      var section = document.getElementById('shorts-section');
      if (!list || !list.length) {
        document.getElementById('tab-shorts').style.display = 'none';
        return;
      }
      section.style.display = 'block';
      shelf.innerHTML = '';
      list.forEach(function(v) {
        var d = document.createElement('div');
        d.className = 'short-card';
        d.innerHTML = '<div class="thumb"><img src="' + v.thumb + '" alt="" loading="lazy"></div><div class="info"><div class="title">' + v.title + '</div><div class="meta">' + (v.views||'') + (v.views&&v.ago?' \u00b7 ':'') + (v.ago||'') + '</div></div>';
        d.addEventListener('click', function(){ openPlayer(v.id); });
        shelf.appendChild(d);
      });
    }

    function switchTab(tab) {
      var videos = document.getElementById('tab-videos');
      var shorts = document.getElementById('tab-shorts');
      videos.classList.toggle('active', tab === 'videos');
      shorts.classList.toggle('active', tab === 'shorts');
      document.getElementById('videos').style.display = tab === 'videos' ? 'block' : 'none';
      document.getElementById('shorts-section').style.display = tab === 'shorts' ? 'block' : 'none';
    }

    renderGrid(VIDEOS.filter(function(x){ return !x.isShort; }));
    renderShorts(VIDEOS.filter(function(x){ return x.isShort; }));
  </script>
