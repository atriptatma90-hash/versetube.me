<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>versetube — Watch & Share</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --accent: #ff3b6b;
      --text: #e8eaf2;
      --muted: #8b90a3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .tag {
      display: inline-block;
      background: rgba(255, 59, 107, .15);
      color: var(--accent);
      padding: .3rem .8rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; letter-spacing: -1px; }
    h1 span { color: var(--accent); }
    p.sub {
      color: var(--muted);
      margin-top: 1rem;
      max-width: 34rem;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    form {
      margin-top: 2.5rem;
      display: flex;
      gap: 0.6rem;
      width: 100%;
      max-width: 30rem;
    }
    input {
      flex: 1;
      padding: .85rem 1.1rem;
      border-radius: 12px;
      border: 1px solid #2a2f3d;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: .85rem 1.4rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .featured {
      margin-top: 3.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 40rem;
    }
    .card {
      background: var(--card);
      border: 1px solid #232838;
      border-radius: 14px;
      padding: 1.25rem;
    }
    .card h3 { font-size: 1rem; margin-bottom: .35rem; }
    .card p { color: var(--muted); font-size: .875rem; line-height: 1.5; }
    footer { margin-top: 4rem; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <div class="tag">Coming soon</div>
  <h1>verse<span>tube</span></h1>
  <p class="sub">Watch, share, and discover the moments that matter — coming to <strong>versetube.me</strong>.</p>
  <form>
    <input type="email" placeholder="name@email.com" aria-label="Email">
    <button type="submit">Notify me</button>
  </form>
  <div class="featured">
    <div class="card">
      <h3>Watch</h3>
      <p>Stream quality video with built-in community tools.</p>
    </div>
    <div class="card">
      <h3>Share</h3>
      <p>Reach every screen — desktop, mobile, and more.</p>
    </div>
    <div class="card">
      <h3>Grow</h3>
      <p>Analytics and creation tools you'll actually love.</p>
    </div>
  </div>
  <footer>&copy; 2026 versetube.me</footer>
</body>
</html>
